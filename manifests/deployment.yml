apiVersion : apps/v1beta1
kind: Deployment
metadata:
  name: "locman"
spec:
  replicas: 2
  template:
    metadata:
      labels:
        app: "locman"
    spec:
      containers:
        - name: "locman"
          image: "revgen.azurecr.io/locman"
          ports:
          - containerPort: 8888